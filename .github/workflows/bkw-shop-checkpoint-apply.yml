name: BKW shop checkpoint apply

on:
  push:
    branches:
      - agent/hud-accent-text-colors

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/hud-accent-text-colors
          fetch-depth: 0
      - name: Apply patch
        run: python3 .github/scripts/bkw_shop_checkpoint_patch.py
      - name: Validate patch
        run: |
          git diff --check
          grep -q 'components/menus_settings_shop.cpp' CMakeLists.txt
          grep -q 'components/skinshop.cpp' CMakeLists.txt
          grep -q 'BKW_TAB_SHOP' src/game/client/components/menus_settings.cpp
          grep -q 'RenderSettingsAssetsShop(PageView)' src/game/client/components/menus_settings.cpp
          grep -q 'KEY_MOUSE_3' src/game/client/components/bestclient/fast_actions.cpp
          grep -q 'Pos.x / 32.0f' src/game/client/components/bestclient/fast_actions.cpp
          ! grep -q 's_TeleportComboTriggered' src/game/client/components/bestclient/fast_actions.cpp
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/bkw-shop-checkpoint-apply.yml .github/scripts/bkw_shop_checkpoint_patch.py
          git add src/game/client/components/menus_settings.cpp src/game/client/components/bestclient/fast_actions.cpp
          git commit -m "BKW: wire shop and fix checkpoint controls"
          git push origin HEAD:agent/hud-accent-text-colors
