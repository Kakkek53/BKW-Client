name: BKW HUD preview apply
on: push
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bkw-save-system
      - run: python3 .github/scripts/bkw_hud_preview_patch.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/bkw-hud-preview-apply.yml .github/scripts/bkw_hud_preview_patch.py
          git add src/game/client/components/menus_settings.cpp
          git commit -m "BKW: add live preview for minimal HUD"
          git push origin HEAD:agent/bkw-save-system
