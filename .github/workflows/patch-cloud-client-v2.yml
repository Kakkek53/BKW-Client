name: Patch BKW client cloud v2

on:
  push:
    branches: [dev]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - run: python3 scripts/patch_cloud_client_v2.py
      - run: |
          grep -n 'schema\\\":2\|LIST_SAVES\|LIST_SHARES\|RegisterBkwProtocol\|bkw_pending_deep_link' src/game/client/components/bkw/cloud_account.h src/engine/shared/config_variables_bkw.inc
          grep -n 'str_startswith(pCommand, "bkw:")' src/engine/client/client.cpp
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/engine/shared/config_variables_bkw.inc src/engine/client/client.cpp src/game/client/components/bkw/cloud_account.h
          git commit -m "Add whole-client cloud saves and share management"
          git push origin HEAD:dev
