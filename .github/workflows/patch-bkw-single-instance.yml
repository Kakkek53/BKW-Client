name: Patch BKW single instance

on:
  push:
    branches: [dev]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - run: python3 scripts/patch_bkw_single_instance.py
      - run: |
          grep -n 'bkw-client-deeplink\|bkw_deep_link\|windows_named_pipe_send\|windows_activate_current_process_window' src/base/windows.h src/base/windows.cpp src/engine/client/client.h src/engine/client/client.cpp
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/base/windows.h src/base/windows.cpp src/engine/client/client.h src/engine/client/client.cpp
          git commit -m "Route bkw deep links to the running client"
          git push origin HEAD:dev
