name: Apply BKW CMake source fix

on:
  push:
    branches: [dev]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - name: Add BKW headers to GAME_CLIENT
        run: >-
          python3 -c 'from pathlib import Path; p=Path("CMakeLists.txt"); t=p.read_text(encoding="utf-8"); old="    components/binds.cpp\n    components/binds.h\n    components/broadcast.cpp\n"; new="    components/binds.cpp\n    components/binds.h\n    components/bkw/cloud_account.h\n    components/bkw/ddstats_hours.h\n    components/bkw/media_background_settings.h\n    components/bkw/save_store.h\n    components/bkw/save_warning.h\n    components/broadcast.cpp\n"; assert old in t, "Expected GAME_CLIENT insertion point not found"; p.write_text(t.replace(old,new,1), encoding="utf-8")'
      - name: Commit source list fix
        run: |
          if git diff --quiet -- CMakeLists.txt; then
            echo "CMake source list already fixed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CMakeLists.txt
          git commit -m "List BKW headers in CMake"
          git push origin HEAD:dev
