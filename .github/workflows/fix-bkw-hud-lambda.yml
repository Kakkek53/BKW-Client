name: Fix BKW HUD lambda compile error
on:
  push:
    branches: [agent/hud-accent-text-colors]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/hud-accent-text-colors
          fetch-depth: 0
      - name: Apply compile fix
        run: python3 .github/scripts/fix_bkw_hud_lambda.py
      - name: Validate diff
        run: git diff --check
      - name: Commit compile fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/fix-bkw-hud-lambda.yml .github/scripts/fix_bkw_hud_lambda.py
          git add src/game/client/components/hud.cpp
          git commit -m "BKW: fix minimal HUD lambda compile error"
          git push origin HEAD:agent/hud-accent-text-colors
