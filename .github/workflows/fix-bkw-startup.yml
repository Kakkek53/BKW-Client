name: Fix BKW startup crash

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/fix-bkw-startup.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Fix console initialization order
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/engine/client/client.cpp')
          text = path.read_text(encoding='utf-8')
          old = '''void CClient::RegisterCommands()\n{\n#if defined(CONF_FAMILY_WINDOWS)\n'''
          new = '''void CClient::RegisterCommands()\n{\n\tm_pConsole = Kernel()->RequestInterface<IConsole>();\n\n#if defined(CONF_FAMILY_WINDOWS)\n'''
          if old not in text:
              raise SystemExit('startup marker not found')
          text = text.replace(old, new, 1)
          old2 = '''#endif\n\tm_pConsole = Kernel()->RequestInterface<IConsole>();\n\n\tm_pConsole->Register("dummy_connect"'''
          new2 = '''#endif\n\n\tm_pConsole->Register("dummy_connect"'''
          if old2 not in text:
              raise SystemExit('old console assignment not found')
          text = text.replace(old2, new2, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/engine/client/client.cpp
          git diff --cached --check
          git commit -m "Fix BKW startup console initialization"
          git push origin HEAD:dev
