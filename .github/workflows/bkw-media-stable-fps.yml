name: BKW stable media FPS
on:
  push:
    paths:
      - '.github/workflows/bkw-media-stable-fps.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bkw-save-system
      - name: Tune media background performance
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/game/client/components/menu_media_background.cpp')
          s = p.read_text(encoding='utf-8')
          s = s.replace('constexpr int MENU_MEDIA_DEFAULT_VIDEO_FRAME_MS = 50;', 'constexpr int MENU_MEDIA_DEFAULT_VIDEO_FRAME_MS = 67;', 1)
          s = s.replace('constexpr int BKW_MEDIA_UPLOAD_MAX_WIDTH = 1280;\n\tconstexpr int BKW_MEDIA_UPLOAD_MAX_HEIGHT = 720;', 'constexpr int BKW_MEDIA_UPLOAD_MAX_WIDTH = 960;\n\tconstexpr int BKW_MEDIA_UPLOAD_MAX_HEIGHT = 540;', 1)
          old = '''\t\twhile(avcodec_receive_frame(m_pCodecCtx, m_pFrame) == 0)\n\t\t{\n\t\t\tint DurationMs = MENU_MEDIA_DEFAULT_VIDEO_FRAME_MS;\n\t\t\tint64_t DurationTs = 0;\n\t\t\tif(m_LastVideoPts != MENU_MEDIA_PTS_UNSET && m_pFrame->best_effort_timestamp != AV_NOPTS_VALUE)\n\t\t\t\tDurationTs = m_pFrame->best_effort_timestamp - m_LastVideoPts;\n\t\t\tif(DurationTs > 0)\n\t\t\t{\n\t\t\t\tconst int64_t Rescaled = av_rescale_q(DurationTs, m_pFormatCtx->streams[m_VideoStream]->time_base, AVRational{1, 1000});\n\t\t\t\tif(Rescaled > 0)\n\t\t\t\t\tDurationMs = (int)Rescaled;\n\t\t\t}\n\t\t\t// Cap the GPU upload rate to 20 FPS. The menu itself keeps rendering at\n\t\t\t// full client FPS using the most recently uploaded frame.\n\t\t\tDurationMs = std::max(DurationMs, MENU_MEDIA_DEFAULT_VIDEO_FRAME_MS);\n\t\t\treturn UploadCurrentVideoFrame(m_aLoadedPath, DurationMs);\n\t\t}\n'''
          new = '''\t\twhile(avcodec_receive_frame(m_pCodecCtx, m_pFrame) == 0)\n\t\t{\n\t\t\tint DurationMs = MENU_MEDIA_DEFAULT_VIDEO_FRAME_MS;\n\t\t\tif(m_LastVideoPts != MENU_MEDIA_PTS_UNSET && m_pFrame->best_effort_timestamp != AV_NOPTS_VALUE)\n\t\t\t{\n\t\t\t\tconst int64_t DurationTs = m_pFrame->best_effort_timestamp - m_LastVideoPts;\n\t\t\t\tif(DurationTs > 0)\n\t\t\t\t{\n\t\t\t\t\tconst int64_t Rescaled = av_rescale_q(DurationTs, m_pFormatCtx->streams[m_VideoStream]->time_base, AVRational{1, 1000});\n\t\t\t\t\t// Keep source playback speed while limiting expensive GPU texture uploads.\n\t\t\t\t\t// For 30/60 FPS videos, intermediate decoded frames are discarded until\n\t\t\t\t\t// roughly 15 FPS worth of source time has elapsed since the last upload.\n\t\t\t\t\tif(Rescaled > 0 && Rescaled < MENU_MEDIA_DEFAULT_VIDEO_FRAME_MS)\n\t\t\t\t\t\tcontinue;\n\t\t\t\t\tif(Rescaled > 0)\n\t\t\t\t\t\tDurationMs = (int)Rescaled;\n\t\t\t\t}\n\t\t\t}\n\t\t\tDurationMs = std::max(DurationMs, MENU_MEDIA_DEFAULT_VIDEO_FRAME_MS);\n\t\t\treturn UploadCurrentVideoFrame(m_aLoadedPath, DurationMs);\n\t\t}\n'''
          if old not in s:
              raise SystemExit('video decode anchor not found')
          s = s.replace(old, new, 1)
          s = s.replace('texture near 720p while preserving aspect ratio', 'texture near 540p while preserving aspect ratio', 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/bkw-media-stable-fps.yml
          git add src/game/client/components/menu_media_background.cpp
          git commit -m "BKW: stabilize animated background frame rate"
          git push origin HEAD:agent/bkw-save-system
