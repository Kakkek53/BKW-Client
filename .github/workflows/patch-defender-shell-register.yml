name: Disable automatic Windows shell registration

on:
  push:
    branches: [dev]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - name: Disable automatic shell registration
        run: >-
          python3 -c 'from pathlib import Path; p=Path("src/engine/client/client.cpp"); t=p.read_text(encoding="utf-8"); old="\t// Register protocol and file extensions\n#if defined(CONF_FAMILY_WINDOWS)\n\tpClient->ShellRegister();\n#endif\n\n"; new="\t// BKW: Do not modify Windows protocol/file associations automatically on startup.\n\t// Shell registration remains available in the engine for explicit installer/user-driven use.\n\n"; assert old in t, "Automatic ShellRegister block not found"; p.write_text(t.replace(old,new,1), encoding="utf-8")'
      - name: Verify startup call is gone
        run: |
          if grep -n 'pClient->ShellRegister();' src/engine/client/client.cpp; then
            echo "Automatic ShellRegister call still present"
            exit 1
          fi
          grep -n 'void CClient::ShellRegister()' src/engine/client/client.cpp
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/engine/client/client.cpp
          git commit -m "Stop automatic Windows shell registration"
          git push origin HEAD:dev
