name: BKW media crash fix
on:
  push:
    paths:
      - '.github/workflows/bkw-media-crash-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bkw-save-system
      - name: Apply crash guards
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/game/client/components/menu_media_background.cpp')
          s = p.read_text(encoding='utf-8')

          s = s.replace(
              'if(m_pGraphics != nullptr)\n\t\tm_pGraphics->UnloadTexture(&m_VideoTexture);',
              'if(m_pGraphics != nullptr && m_VideoTexture.IsValid())\n\t\tm_pGraphics->UnloadTexture(&m_VideoTexture);'
          )

          old = '''void CMenuMediaBackground::ReloadFromConfig(int Enabled, const char *pPath)\n{\n\tchar aPath[IO_MAX_PATH_LENGTH];\n\tstr_copy(aPath, pPath, sizeof(aPath));\n\n\tUnload();\n\n\tm_LastConfigEnabled = Enabled;\n\tstr_copy(m_aLastConfigPath, aPath, sizeof(m_aLastConfigPath));\n\n\tif(!Enabled)\n\t{\n\t\tSetStatus(Localize("Disabled."));\n\t\treturn;\n\t}\n'''
          new = '''void CMenuMediaBackground::ReloadFromConfig(int Enabled, const char *pPath)\n{\n\tchar aPath[IO_MAX_PATH_LENGTH];\n\tstr_copy(aPath, pPath, sizeof(aPath));\n\n\t// On the first config sync the media background is usually disabled.\n\t// Avoid touching graphics resources that have never been created. This is\n\t// especially important for older OpenGL drivers.\n\tif(!Enabled && !m_IsLoaded && !m_IsVideo && m_vFrames.empty() && !m_VideoTexture.IsValid())\n\t{\n\t\tm_LastConfigEnabled = Enabled;\n\t\tstr_copy(m_aLastConfigPath, aPath, sizeof(m_aLastConfigPath));\n\t\tSetStatus(Localize("Disabled."));\n\t\treturn;\n\t}\n\n\tUnload();\n\n\tm_LastConfigEnabled = Enabled;\n\tstr_copy(m_aLastConfigPath, aPath, sizeof(m_aLastConfigPath));\n\n\tif(!Enabled)\n\t{\n\t\tSetStatus(Localize("Disabled."));\n\t\treturn;\n\t}\n'''
          if old not in s:
              raise SystemExit('ReloadFromConfig anchor not found')
          s = s.replace(old, new, 1)

          # Refuse absurdly large videos before allocating/uploading RGBA frames.
          old2 = '''\tm_Width = m_pCodecCtx->width;\n\tm_Height = m_pCodecCtx->height;\n\tif(m_Width <= 0 || m_Height <= 0)\n\t{\n\t\tSetError(Localize("Invalid video dimensions."));\n\t\tClearVideoState();\n\t\treturn false;\n\t}\n'''
          new2 = '''\tm_Width = m_pCodecCtx->width;\n\tm_Height = m_pCodecCtx->height;\n\tif(m_Width <= 0 || m_Height <= 0)\n\t{\n\t\tSetError(Localize("Invalid video dimensions."));\n\t\tClearVideoState();\n\t\treturn false;\n\t}\n\tconstexpr int BKW_MEDIA_MAX_DIMENSION = 4096;\n\tconstexpr int64_t BKW_MEDIA_MAX_PIXELS = 4096ll * 4096ll;\n\tif(m_Width > BKW_MEDIA_MAX_DIMENSION || m_Height > BKW_MEDIA_MAX_DIMENSION || (int64_t)m_Width * (int64_t)m_Height > BKW_MEDIA_MAX_PIXELS)\n\t{\n\t\tSetError(Localize("Video resolution is too large for a menu background."));\n\t\tClearVideoState();\n\t\treturn false;\n\t}\n'''
          if old2 not in s:
              raise SystemExit('video dimensions anchor not found')
          s = s.replace(old2, new2, 1)
          p.write_text(s, encoding='utf-8')

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/bkw-media-crash-fix.yml
          git add src/game/client/components/menu_media_background.cpp
          git commit -m "BKW: harden media background startup"
          git push origin HEAD:agent/bkw-save-system
