name: BKW minimal HUD
on:
  push:
    paths:
      - '.github/workflows/bkw-minimal-hud.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bkw-save-system
      - name: Patch minimal HUD
        shell: python
        run: |
          from pathlib import Path

          # Config toggle
          p = Path('src/engine/shared/config_variables_bestclient.h')
          s = p.read_text(encoding='utf-8')
          line = 'MACRO_CONFIG_INT(BkwMinimalHud, bkw_minimal_hud, 0, 0, 1, CFGFLAG_CLIENT | CFGFLAG_SAVE, "Enable BKW minimal HUD")\n'
          if 'BkwMinimalHud' not in s:
              s += '\n' + line
          p.write_text(s, encoding='utf-8')

          # HUD declaration
          p = Path('src/game/client/components/hud.h')
          s = p.read_text(encoding='utf-8')
          anchor = '\tvoid RenderLocalTime(bool ForcePreview = false);\n'
          if 'RenderBkwMinimalHud' not in s:
              if anchor not in s:
                  raise SystemExit('hud.h anchor not found')
              s = s.replace(anchor, anchor + '\tvoid RenderBkwMinimalHud();\n', 1)
          p.write_text(s, encoding='utf-8')

          # HUD implementation + render call
          p = Path('src/game/client/components/hud.cpp')
          s = p.read_text(encoding='utf-8')
          if 'void CHud::RenderBkwMinimalHud()' not in s:
              impl_anchor = 'bool CHud::RebuildFinishPredictionPathData() const\n'
              if impl_anchor not in s:
                  raise SystemExit('hud.cpp implementation anchor not found')
              impl = r'''
void CHud::RenderBkwMinimalHud()
{
	if(!g_Config.m_BkwMinimalHud || Client()->State() != IClient::STATE_ONLINE)
		return;

	const int LocalId = GameClient()->m_Snap.m_LocalClientId;
	if(LocalId < 0 || LocalId >= MAX_CLIENTS)
		return;

	const float FrameTime = Client()->RenderFrameTime();
	const int Fps = FrameTime > 0.000001f ? (int)std::round(1.0f / FrameTime) : 0;
	int Ping = 0;
	if(GameClient()->m_Snap.m_apPlayerInfos[LocalId])
		Ping = maximum(0, GameClient()->m_Snap.m_apPlayerInfos[LocalId]->m_Latency);

	const int Team = GameClient()->m_Teams.Team(LocalId);
	bool Practice = false;
	const auto &Character = GameClient()->m_Snap.m_aCharacters[LocalId];
	if(Character.m_Active && Character.m_HasExtendedData)
		Practice = (Character.m_ExtendedData.m_Flags & CHARACTERFLAG_PRACTICE_MODE) != 0;

	char aLine[128];
	if(Practice)
		str_format(aLine, sizeof(aLine), "%d FPS   %d ms   TEAM %d   PRACTICE", Fps, Ping, Team);
	else
		str_format(aLine, sizeof(aLine), "%d FPS   %d ms   TEAM %d", Fps, Ping, Team);

	const float FontSize = 6.5f;
	const float PaddingX = 6.0f;
	const float PaddingY = 4.0f;
	const float Width = TextRender()->TextWidth(FontSize, aLine) + PaddingX * 2.0f;
	const float Height = FontSize + PaddingY * 2.0f;
	const float X = 5.0f;
	const float Y = 5.0f;

	Graphics()->DrawRect(X, Y, Width, Height, ColorRGBA(0.03f, 0.03f, 0.03f, 0.62f), IGraphics::CORNER_ALL, 4.5f);
	TextRender()->TextColor(0.94f, 0.96f, 1.0f, 1.0f);
	TextRender()->Text(X + PaddingX, Y + PaddingY, FontSize, aLine, -1.0f);
	TextRender()->TextColor(TextRender()->DefaultTextColor());
}

'''
              s = s.replace(impl_anchor, impl + impl_anchor, 1)

          if 'RenderBkwMinimalHud();' not in s:
              call_anchor = '\tRenderLocalTime();\n'
              if call_anchor not in s:
                  raise SystemExit('RenderLocalTime call anchor not found')
              s = s.replace(call_anchor, call_anchor + '\tRenderBkwMinimalHud();\n', 1)
          p.write_text(s, encoding='utf-8')

          # BKW UI tab + checkbox
          p = Path('src/game/client/components/menus_settings.cpp')
          s = p.read_text(encoding='utf-8')
          if 'BKW_TAB_HUD' not in s:
              s = s.replace('\t\tBKW_TAB_HOURS,\n\t\tBKW_TAB_BACKGROUND,', '\t\tBKW_TAB_HOURS,\n\t\tBKW_TAB_HUD,\n\t\tBKW_TAB_BACKGROUND,', 1)
              s = s.replace('static int s_MediaBackgroundToggleId;', 'static int s_MinimalHudToggleId;\n\t\tstatic int s_MediaBackgroundToggleId;', 1)
              s = s.replace('{"Сохранение", "Чекпоинты", "Игрок", "Кланы", "Часы", "Фон", "Выход"}', '{"Сохранение", "Чекпоинты", "Игрок", "Кланы", "Часы", "HUD", "Фон", "Выход"}', 1)

          if 'BKW — Минималистичный HUD' not in s:
              anchor = '\t\telse if(s_BkwTab == BKW_TAB_BACKGROUND)\n'
              if anchor not in s:
                  raise SystemExit('BKW background tab anchor not found')
              block = r'''
		else if(s_BkwTab == BKW_TAB_HUD)
		{
			CUIRect Header;
			PageView.HSplitTop(28.0f, &Header, &PageView);
			Ui()->DoLabel(&Header, "BKW — Минималистичный HUD", 22.0f, TEXTALIGN_ML);
			PageView.HSplitTop(8.0f, nullptr, &PageView);

			CUIRect Toggle;
			PageView.HSplitTop(28.0f, &Toggle, &PageView);
			if(DoButton_CheckBox(&s_MinimalHudToggleId, "Минималистичный HUD", g_Config.m_BkwMinimalHud, &Toggle))
				g_Config.m_BkwMinimalHud ^= 1;

			PageView.HSplitTop(10.0f, nullptr, &PageView);
			CUIRect Card;
			PageView.HSplitTop(92.0f, &Card, &PageView);
			Card.Draw(ColorRGBA(0.08f, 0.08f, 0.08f, 0.42f), IGraphics::CORNER_ALL, 6.0f);
			Card.Margin(10.0f, &Card);
			CUIRect L1, L2, L3;
			Card.HSplitTop(24.0f, &L1, &Card);
			Card.HSplitTop(24.0f, &L2, &Card);
			Card.HSplitTop(24.0f, &L3, &Card);
			Ui()->DoLabel(&L1, "Компактная панель в левом верхнем углу.", 12.0f, TEXTALIGN_ML);
			Ui()->DoLabel(&L2, "Показывает FPS, точный ping и номер team.", 11.0f, TEXTALIGN_ML);
			Ui()->DoLabel(&L3, "В режиме /practice дополнительно показывает PRACTICE.", 11.0f, TEXTALIGN_ML);
		}
'''
              s = s.replace(anchor, block + anchor, 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/bkw-minimal-hud.yml
          git add src/engine/shared/config_variables_bestclient.h src/game/client/components/hud.h src/game/client/components/hud.cpp src/game/client/components/menus_settings.cpp
          git commit -m "BKW: add minimal HUD toggle and overlay"
          git push origin HEAD:agent/bkw-save-system
