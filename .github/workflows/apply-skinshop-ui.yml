name: Apply skin shop UI patch

on:
  push:
    branches:
      - agent/hud-accent-text-colors
    paths:
      - .github/workflows/apply-skinshop-ui.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/hud-accent-text-colors
          fetch-depth: 0

      - name: Patch shop UI
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'pattern not found in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # CMake: compile the new backend and UI source files.
          replace_once(
              'CMakeLists.txt',
              '    components/scoreboard.cpp\n    components/scoreboard.h\n    components/skins.cpp\n',
              '    components/scoreboard.cpp\n    components/scoreboard.h\n    components/skinshop.cpp\n    components/skinshop.h\n    components/skins.cpp\n')
          replace_once(
              'CMakeLists.txt',
              '    components/menus_settings_player.cpp\n    components/menus_settings_sound.cpp\n',
              '    components/menus_settings_player.cpp\n    components/menus_settings_shop.cpp\n    components/menus_settings_sound.cpp\n')

          # Menus: own the shop backend and expose the renderer.
          replace_once(
              'src/game/client/components/menus.h',
              '#include <game/client/components/skins7.h>\n',
              '#include <game/client/components/skinshop.h>\n#include <game/client/components/skins7.h>\n')
          replace_once(
              'src/game/client/components/menus.h',
              '\tbool m_IsInit = false;\n',
              '\tCSkinShop m_SkinShop;\n\tbool m_IsInit = false;\n')
          replace_once(
              'src/game/client/components/menus.h',
              '\t// found in menus_settings_assets.cpp\n\tvoid RenderSettingsAssets(CUIRect MainView);\n',
              '\t// found in menus_settings_assets.cpp\n\tvoid RenderSettingsAssets(CUIRect MainView);\n\n\t// found in menus_settings_shop.cpp\n\tvoid RenderSettingsAssetsShop(CUIRect MainView);\n')

          # Assets page: add a separate Shop toggle without expanding NUMBER_OF_ASSETS_TABS.
          replace_once(
              'src/game/client/components/menus_settings_assets.cpp',
              'static int s_CurCustomTab = ASSETS_TAB_ENTITIES;\n',
              'static int s_CurCustomTab = ASSETS_TAB_ENTITIES;\nstatic bool s_AssetsShopOpen = false;\n')

          old_tabs = '''\tMainView.HSplitTop(20.0f, &TabBar, &MainView);\n\tconst float TabWidth = TabBar.w / (float)NUMBER_OF_ASSETS_TABS;\n\tstatic CButtonContainer s_aPageTabs[NUMBER_OF_ASSETS_TABS] = {};\n\tconst char *apTabNames[NUMBER_OF_ASSETS_TABS] = {\n\t\tLocalize("Entities"),\n\t\tLocalize("Game"),\n\t\tLocalize("Emoticons"),\n\t\tLocalize("Particles"),\n\t\tLocalize("HUD"),\n\t\tLocalize("Extras"),\n\t\tLocalize("Cursor"),\n\t\tLocalize("Arrow"),\n\t\tLocalize("Audio")};\n\n\tfor(int Tab = ASSETS_TAB_ENTITIES; Tab < NUMBER_OF_ASSETS_TABS; ++Tab)\n\t{\n\t\tCUIRect Button;\n\t\tTabBar.VSplitLeft(TabWidth, &Button, &TabBar);\n\t\tconst int Corners = Tab == ASSETS_TAB_ENTITIES ? IGraphics::CORNER_L : (Tab == NUMBER_OF_ASSETS_TABS - 1 ? IGraphics::CORNER_R : IGraphics::CORNER_NONE);\n\t\tif(DoButton_MenuTab(&s_aPageTabs[Tab], apTabNames[Tab], s_CurCustomTab == Tab, &Button, Corners, nullptr, nullptr, nullptr, nullptr, 4.0f))\n\t\t{\n\t\t\ts_CurCustomTab = Tab;\n\t\t}\n\t}\n'''
          new_tabs = '''\tMainView.HSplitTop(20.0f, &TabBar, &MainView);\n\tCUIRect ShopButton;\n\tTabBar.VSplitRight(76.0f, &TabBar, &ShopButton);\n\tTabBar.VSplitRight(5.0f, &TabBar, nullptr);\n\n\tconst float TabWidth = TabBar.w / (float)NUMBER_OF_ASSETS_TABS;\n\tstatic CButtonContainer s_aPageTabs[NUMBER_OF_ASSETS_TABS] = {};\n\tconst char *apTabNames[NUMBER_OF_ASSETS_TABS] = {\n\t\tLocalize("Entities"),\n\t\tLocalize("Game"),\n\t\tLocalize("Emoticons"),\n\t\tLocalize("Particles"),\n\t\tLocalize("HUD"),\n\t\tLocalize("Extras"),\n\t\tLocalize("Cursor"),\n\t\tLocalize("Arrow"),\n\t\tLocalize("Audio")};\n\n\tfor(int Tab = ASSETS_TAB_ENTITIES; Tab < NUMBER_OF_ASSETS_TABS; ++Tab)\n\t{\n\t\tCUIRect Button;\n\t\tTabBar.VSplitLeft(TabWidth, &Button, &TabBar);\n\t\tconst int Corners = Tab == ASSETS_TAB_ENTITIES ? IGraphics::CORNER_L : (Tab == NUMBER_OF_ASSETS_TABS - 1 ? IGraphics::CORNER_R : IGraphics::CORNER_NONE);\n\t\tif(DoButton_MenuTab(&s_aPageTabs[Tab], apTabNames[Tab], !s_AssetsShopOpen && s_CurCustomTab == Tab, &Button, Corners, nullptr, nullptr, nullptr, nullptr, 4.0f))\n\t\t{\n\t\t\ts_CurCustomTab = Tab;\n\t\t\ts_AssetsShopOpen = false;\n\t\t}\n\t}\n\n\tstatic CButtonContainer s_ShopTab;\n\tif(DoButton_MenuTab(&s_ShopTab, Localize("Shop"), s_AssetsShopOpen, &ShopButton, IGraphics::CORNER_ALL, nullptr, nullptr, nullptr, nullptr, 4.0f))\n\t\ts_AssetsShopOpen = true;\n\n\tif(s_AssetsShopOpen)\n\t{\n\t\tMainView.HSplitTop(10.0f, nullptr, &MainView);\n\t\tRenderSettingsAssetsShop(MainView);\n\t\treturn;\n\t}\n'''
          replace_once('src/game/client/components/menus_settings_assets.cpp', old_tabs, new_tabs)

          shop_cpp = r'''#include "menus.h"

#include <base/str.h>

#include <game/client/ui_listbox.h>
#include <game/localization.h>

#include <algorithm>

void CMenus::RenderSettingsAssetsShop(CUIRect MainView)
{
	m_SkinShop.Init(Http());
	m_SkinShop.Update();

	// Continue fetching page 2, 3, ... automatically. The API caps every page at 100.
	if(!m_SkinShop.Loading() && !m_SkinShop.Error() && m_SkinShop.HasMore() && m_SkinShop.LoadedPage() > 0)
		m_SkinShop.LoadNextPage();

	CUIRect Header, CategoryBar, Status, ListView, Details;
	MainView.HSplitTop(24.0f, &Header, &MainView);
	Ui()->DoLabel(&Header, Localize("Texture shop"), 18.0f, TEXTALIGN_ML);

	MainView.HSplitTop(5.0f, nullptr, &MainView);
	MainView.HSplitTop(24.0f, &CategoryBar, &MainView);

	static CButtonContainer s_aCategoryButtons[(int)ESkinShopCategory::NUM_CATEGORIES];
	const float CategoryWidth = CategoryBar.w / (float)((int)ESkinShopCategory::NUM_CATEGORIES);
	for(int i = 0; i < (int)ESkinShopCategory::NUM_CATEGORIES; ++i)
	{
		const ESkinShopCategory Category = (ESkinShopCategory)i;
		CUIRect Button;
		CategoryBar.VSplitLeft(CategoryWidth, &Button, &CategoryBar);
		const int Corners = i == 0 ? IGraphics::CORNER_L : (i == (int)ESkinShopCategory::NUM_CATEGORIES - 1 ? IGraphics::CORNER_R : IGraphics::CORNER_NONE);
		if(DoButton_MenuTab(&s_aCategoryButtons[i], CSkinShop::CategoryName(Category), m_SkinShop.Category() == Category, &Button, Corners, nullptr, nullptr, nullptr, nullptr, 4.0f))
		{
			m_SkinShop.SetCategory(Category);
		}
	}

	MainView.HSplitTop(8.0f, nullptr, &MainView);
	MainView.HSplitBottom(76.0f, &ListView, &Details);
	Details.HSplitTop(8.0f, nullptr, &Details);

	const auto &vItems = m_SkinShop.Items();
	static CListBox s_ShopListBox;
	static int s_Selected = -1;
	static ESkinShopCategory s_SelectedCategory = ESkinShopCategory::NUM_CATEGORIES;
	if(s_SelectedCategory != m_SkinShop.Category())
	{
		s_SelectedCategory = m_SkinShop.Category();
		s_Selected = -1;
	}
	if(s_Selected >= (int)vItems.size())
		s_Selected = -1;

	if(vItems.empty())
	{
		const char *pMessage = m_SkinShop.Error() ? Localize("Could not load the shop. Try opening the tab again.") : Localize("Loading shop items...");
		Ui()->DoLabel(&ListView, pMessage, 16.0f, TEXTALIGN_MC);
	}
	else
	{
		s_ShopListBox.DoStart(48.0f, vItems.size(), 1, 1, s_Selected, &ListView, false);
		for(size_t i = 0; i < vItems.size(); ++i)
		{
			const SSkinShopItem &ItemData = vItems[i];
			const CListboxItem Item = s_ShopListBox.DoNextItem(&ItemData, s_Selected == (int)i);
			if(!Item.m_Visible)
				continue;

			CUIRect Row = Item.m_Rect;
			Row.Margin(5.0f, &Row);
			CUIRect Name, Meta;
			Row.HSplitTop(20.0f, &Name, &Meta);
			Ui()->DoLabel(&Name, ItemData.m_Name.c_str(), 15.0f, TEXTALIGN_ML);

			char aMeta[256];
			if(!ItemData.m_Author.empty())
				str_format(aMeta, sizeof(aMeta), "%s  •  %dx%d  •  %s", ItemData.m_Author.c_str(), ItemData.m_Width, ItemData.m_Height, ItemData.m_Type.c_str());
			else
				str_format(aMeta, sizeof(aMeta), "%dx%d  •  %s", ItemData.m_Width, ItemData.m_Height, ItemData.m_Type.c_str());
			Ui()->DoLabel(&Meta, aMeta, 12.0f, TEXTALIGN_ML);
		}
		s_Selected = s_ShopListBox.DoEnd();
	}

	if(s_Selected >= 0 && s_Selected < (int)vItems.size())
	{
		const SSkinShopItem &Selected = vItems[s_Selected];
		CUIRect Name, Info;
		Details.HSplitTop(24.0f, &Name, &Info);
		Ui()->DoLabel(&Name, Selected.m_Name.c_str(), 16.0f, TEXTALIGN_ML);

		char aInfo[512];
		str_format(aInfo, sizeof(aInfo), "%s%s%s  |  page %d%s",
			Selected.m_Author.empty() ? "" : Selected.m_Author.c_str(),
			Selected.m_Author.empty() ? "" : "  |  ",
			Selected.m_FileName.c_str(),
			m_SkinShop.LoadedPage(),
			m_SkinShop.Loading() ? "  |  loading more..." : "");
		Ui()->DoLabel(&Info, aInfo, 12.0f, TEXTALIGN_ML);
	}
	else
	{
		char aStatus[128];
		str_format(aStatus, sizeof(aStatus), "%zu items%s", vItems.size(), m_SkinShop.Loading() ? "  •  loading more..." : "");
		Ui()->DoLabel(&Details, aStatus, 13.0f, TEXTALIGN_ML);
	}
}
'''
          Path('src/game/client/components/menus_settings_shop.cpp').write_text(shop_cpp, encoding='utf-8')

          # The helper is intentionally self-removing; only product code remains at HEAD.
          Path('.github/workflows/apply-skinshop-ui.yml').unlink()
          PY

      - name: Validate patch
        run: |
          git diff --check
          grep -q 'components/skinshop.cpp' CMakeLists.txt
          grep -q 'components/menus_settings_shop.cpp' CMakeLists.txt
          grep -q 'RenderSettingsAssetsShop' src/game/client/components/menus.h
          grep -q 'Localize("Shop")' src/game/client/components/menus_settings_assets.cpp

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CMakeLists.txt src/game/client/components/menus.h src/game/client/components/menus_settings_assets.cpp src/game/client/components/menus_settings_shop.cpp .github/workflows/apply-skinshop-ui.yml
          git commit -m "BKW: add skin shop browser UI"
          git push origin HEAD:agent/hud-accent-text-colors
